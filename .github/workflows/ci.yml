name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    # Everything, including the live tests, against a PostgreSQL service container.
    name: Linux (Swift ${{ matrix.swift }}, ${{ matrix.configuration }})
    runs-on: ubuntu-24.04
    container: swift:${{ matrix.swift }}-noble
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported Swift (swift-tools-version 6.2) and the newest.
        swift: ["6.2", "6.4"]
        configuration: [debug, release]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PG_TESTS: "1"
      PGUSER: postgres
    steps:
      - uses: actions/checkout@v7

      - name: Install client libraries
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libpq-dev pkg-config

      # The tests connect with "host=localhost", which PGHOST can't override. libpq's
      # PGHOSTADDR can: the connection goes to hostaddr, and host is only used for
      # authentication and TLS.
      - name: Point libpq at the service
        run: |
          addr=$(getent hosts postgres | awk '{ print $1; exit }')
          if [ -z "$addr" ]; then
            echo "Could not resolve the postgres service"
            exit 1
          fi
          echo "PGHOSTADDR=$addr" >> "$GITHUB_ENV"

      - name: Toolchain
        run: swift --version

      - name: Build (warnings are errors)
        run: |
          flags="-c ${{ matrix.configuration }} -Xswiftc -warnings-as-errors"
          # @testable imports need testing enabled in an optimized build.
          [ "${{ matrix.configuration }}" = release ] && flags="$flags -Xswiftc -enable-testing"
          echo "FLAGS=$flags" >> "$GITHUB_ENV"
          swift build --build-tests $flags

      - name: Test
        run: swift test $FLAGS

  macos:
    # GitHub's macOS runners have no PostgreSQL server: this builds everything and runs the
    # tests that don't need one (the live tests do nothing without PG_TESTS=1).
    name: macOS (Xcode ${{ matrix.xcode }}, ${{ matrix.configuration }})
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The oldest Xcode with Swift 6.2, and the runner's default.
        xcode: ["26.0.1", "26.6"]
        configuration: [debug, release]
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app
          swift --version

      - name: Install client libraries
        run: |
          brew install libpq
          # libpq is keg-only, so pkg-config doesn't find it without this.
          echo "PKG_CONFIG_PATH=$(brew --prefix libpq)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Build (warnings are errors)
        run: |
          flags="-c ${{ matrix.configuration }} -Xswiftc -warnings-as-errors"
          # @testable imports need testing enabled in an optimized build.
          [ "${{ matrix.configuration }}" = release ] && flags="$flags -Xswiftc -enable-testing"
          echo "FLAGS=$flags" >> "$GITHUB_ENV"
          swift build --build-tests $flags

      - name: Test
        run: swift test $FLAGS
